<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3344"/>
      <stop offset="1" stop-color="#11151d"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6f9f"/>
      <stop offset="1" stop-color="#5a3f86"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="292" y="188" width="440" height="620" rx="40"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="48" y="48" width="928" height="928" rx="208" fill="url(#bg)"/>
  <rect x="48" y="48" width="928" height="928" rx="208" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6"/>

  <!-- Photocard -->
  <g filter="url(#shadow)">
    <rect x="292" y="188" width="440" height="620" rx="40" fill="#f7f6f2"/>
  </g>
  <g clip-path="url(#card)">
    <rect x="292" y="188" width="440" height="330" fill="url(#sky)"/>
    <circle cx="628" cy="290" r="54" fill="#f6c46a"/>
    <path d="M292 518 L292 430 L392 344 L462 404 L540 330 L650 430 L732 384 L732 518 Z" fill="#17243a"/>
  </g>
  <!-- Breaking tag -->
  <rect x="332" y="488" width="170" height="60" rx="10" fill="#e53935"/>
  <!-- Headline lines -->
  <rect x="332" y="586" width="360" height="34" rx="17" fill="#1c2230"/>
  <rect x="332" y="640" width="290" height="34" rx="17" fill="#1c2230"/>
  <rect x="332" y="712" width="200" height="22" rx="11" fill="#1c2230" fill-opacity="0.35"/>

  <!-- Selection frame + handles -->
  <rect x="262" y="158" width="500" height="680" fill="none" stroke="#0d99ff" stroke-width="12"/>
  <g fill="#ffffff" stroke="#0d99ff" stroke-width="12">
    <rect x="232" y="128" width="60" height="60" rx="8"/>
    <rect x="732" y="128" width="60" height="60" rx="8"/>
    <rect x="232" y="808" width="60" height="60" rx="8"/>
    <rect x="732" y="808" width="60" height="60" rx="8"/>
  </g>
</svg>
